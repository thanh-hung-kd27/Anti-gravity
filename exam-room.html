<!DOCTYPE html>
<html lang="vi" class="scroll-smooth" id="htmlRoot">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phòng Thi Trực Tuyến & Socratic AI Tutor | IELTS Syntax</title>

  <!-- Google Fonts: Inter & Roboto Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
            mono: ['"Roboto Mono"', 'monospace'],
          },
          colors: {
            iot: {
              navy: '#0B2545',
              primary: '#0056B3',
              primaryLight: '#0D6EFD',
              blueLight: '#EBF3FE',
              orange: '#F58220',
              orangeHover: '#E06D14',
              green: '#28A745',
              dark: '#1F2937',
              body: '#374151',
              muted: '#6C757D',
              border: '#E5E7EB',
              bgLight: '#F8F9FA',
            }
          },
          boxShadow: {
            'iot-card': '0 2px 6px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.04)',
            'ai-sidebar': '-5px 0 25px rgba(0, 0, 0, 0.06)',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Socratic AI Cognitive Self-Learning Engine -->
  <script src="ai-engine.js"></script>
  <!-- Academic Dictionary & Multi-tier Translation Suite -->
  <script src="academic-dictionary-translator.js"></script>
  <!-- Additional Official Cambridge Listening Tests (Cam 19 T2-4, Cam 18 T2, Actual Vol 4-5) -->
  <script src="listening-tests-data.js"></script>
  <!-- Authentic Cambridge 4-Part IELTS Listening Engine (40 Questions & Native Audio) -->
  <script src="listening-engine.js"></script>
  <!-- Authentic Cambridge 3-Passage IELTS Reading Engine (40 Questions, 60 Minutes) -->
  <script src="reading-engine.js"></script>
  <!-- Authentic Cambridge 3-Part IELTS Speaking Engine (11–14 Minutes, 3 Parts, IDP/BC) -->
  <script src="speaking-engine.js"></script>
  <!-- Secure CD-IELTS Fullscreen Kiosk Lockdown & Anti-Cheat Proctoring Engine -->
  <script src="exam-lockdown.js"></script>
  <!-- Additional Official Cambridge & Philosophical Writing Tests Data -->
  <script src="writing-tests-data.js"></script>
  <!-- Authentic Cambridge 2-Task IELTS Writing Engine (60 Minutes, Task 1 & Task 2, IDP/BC) -->
  <script src="writing-engine.js"></script>

  <style>
    body {
      font-size: 15px;
      line-height: 1.6;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #F8F9FA;
    }

    .dark ::-webkit-scrollbar-track {
      background: #0F172A;
    }

    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }
  </style>
</head>

<body
  class="antialiased bg-[#F8F9FA] text-iot-body dark:bg-[#071326] dark:text-slate-200 h-screen flex flex-col overflow-hidden">

  <!-- TOP ROOM NAV BAR -->
  <header
    class="bg-iot-navy text-white px-5 py-3 flex flex-wrap items-center justify-between gap-3 border-b border-white/10 dark:bg-[#050C1A] shrink-0">

    <!-- Left: Back to Library & Test Info -->
    <div class="flex items-center gap-4">
      <a href="library.html"
        class="flex items-center gap-1.5 text-xs text-slate-300 hover:text-white px-2.5 py-1.5 rounded-lg bg-white/10 transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Quay Lại Thư Viện</span>
      </a>

      <div class="h-5 w-px bg-white/20 hidden sm:block"></div>

      <div class="flex items-center gap-2.5">
        <span id="activeSkillBadge"
          class="bg-emerald-600 text-white text-xs font-bold px-2 py-0.5 rounded font-mono uppercase">
          READING
        </span>
        <div>
          <h1 class="text-sm font-bold text-white leading-tight" id="activeExamTitle">
            Cambridge 19 - Test 1: Academic Reading (Passages 1–3)
          </h1>
          <span class="text-[11px] text-slate-300 font-mono">IELTS Academic Computer-Delivered Interface</span>
        </div>
      </div>
    </div>

    <!-- Center: Official Cambridge CD-IELTS Status Indicator -->
    <div class="hidden md:flex items-center gap-2 px-3.5 py-1.5 rounded-lg bg-white/10 font-mono text-xs text-slate-200 border border-white/10">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="font-bold">Cambridge Computer-Delivered IELTS Testing Engine</span>
    </div>

    <!-- Right: Timer, Theme & Submit -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- AI Cognitive Profile Pill -->
      <button onclick="window.academicDictionary.openDictionaryModal()"
        class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-mono transition-all border border-white/15"
        title="Mở Từ Điển & Dịch Thuật Học Thuật">
        <i data-lucide="languages" class="w-3.5 h-3.5 text-blue-300"></i>
        <span class="hidden md:inline">Từ Điển &amp; Dịch</span>
      </button>

      <button onclick="window.socraticAI.openCognitiveProfileModal()"
        class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-mono transition-all border border-white/15"
        title="Mở Hồ Sơ & Đổi Tên Học Viên">
        <i data-lucide="brain" class="w-3.5 h-3.5 text-amber-300"></i>
        <span id="navBarStudentBadge" class="hidden sm:inline">Học viên (8.0)</span>
      </button>

      <div
        class="flex items-center gap-1.5 font-mono text-xs bg-white/10 px-3 py-1.5 rounded-lg border border-white/10">
        <i data-lucide="clock" class="w-3.5 h-3.5 text-iot-orange"></i>
        <span id="roomTimer" class="font-bold text-white">60:00</span>
      </div>

      <!-- Fullscreen Kiosk Mode Indicator / Toggle -->
      <button id="btnToggleFullscreen"
        onclick="window.examLockdown && window.examLockdown.toggleExamLockdownFullscreen()"
        class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-mono transition-all border border-white/15"
        title="Khóa Toàn Màn Hình Khảo Thí">
        <i data-lucide="maximize" class="w-3.5 h-3.5"></i>
        <span class="hidden lg:inline">Toàn Màn Hình</span>
      </button>

      <button onclick="toggleTheme()" class="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white"
        title="Chuyển chế độ sáng/tối">
        <i id="themeToggleIcon" data-lucide="moon" class="w-4 h-4"></i>
      </button>

      <button onclick="submitExam()"
        class="bg-iot-green hover:bg-green-700 text-white text-xs font-bold px-3 sm:px-4 py-2 rounded-lg shadow-sm transition-all flex items-center gap-1.5 active:scale-95">
        <i data-lucide="check-square" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">Nộp Bài Thi</span>
        <span class="sm:hidden">Nộp</span>
      </button>
    </div>

  </header>

  <!-- FULLSCREEN CD-IELTS EXAM WORKSPACE (100% WIDTH) -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <div
      class="flex-1 w-full bg-white dark:bg-[#0B132B] overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6"
      id="testViewport">
      <!-- Dynamic Content rendered by JavaScript -->
    </div>
  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    lucide.createIcons();

    // Theme Engine
    const htmlRoot = document.getElementById('htmlRoot');
    const themeToggleIcon = document.getElementById('themeToggleIcon');
    const savedTheme = localStorage.getItem('iot-theme') || 'light';
    applyTheme(savedTheme);

    function toggleTheme() {
      const isDark = htmlRoot.classList.contains('dark');
      applyTheme(isDark ? 'light' : 'dark');
    }

    function applyTheme(theme) {
      if (theme === 'dark') {
        htmlRoot.classList.add('dark');
        localStorage.setItem('iot-theme', 'dark');
        if (themeToggleIcon) themeToggleIcon.setAttribute('data-lucide', 'sun');
      } else {
        htmlRoot.classList.remove('dark');
        localStorage.setItem('iot-theme', 'light');
        if (themeToggleIcon) themeToggleIcon.setAttribute('data-lucide', 'moon');
      }
      lucide.createIcons();
    }


    // Get URL Parameters (e.g. ?id=wri-cam19-t1&skill=READING)
    const urlParams = new URLSearchParams(window.location.search);
    const rawSkill = (urlParams.get('skill') || '').trim().toUpperCase();
    const rawTitle = urlParams.get('title') || '';

    let skillParam = rawSkill;
    if (!skillParam) {
      if (rawTitle.toLowerCase().includes('reading')) skillParam = 'READING';
      else if (rawTitle.toLowerCase().includes('listening')) skillParam = 'LISTENING';
      else if (rawTitle.toLowerCase().includes('speaking')) skillParam = 'SPEAKING';
      else if (rawTitle.toLowerCase().includes('writing')) skillParam = 'WRITING';
      else skillParam = 'READING'; // Default to READING
    }
    window.activeExamSkill = skillParam;

    const defaultTitle = skillParam === 'READING'
      ? 'Cambridge 19 - Test 1: Academic Reading (Passages 1–3)'
      : (skillParam === 'LISTENING' ? 'Cambridge 19 - Test 1: Listening (Sections 1–4)' : (skillParam === 'SPEAKING' ? 'Cambridge 19 - Test 1: Speaking Interview' : 'Cambridge 19 - Test 1: Academic Writing (Tasks 1 & 2)'));
    const titleParam = rawTitle || defaultTitle;

    const skillBadge = document.getElementById('activeSkillBadge');
    if (skillBadge) {
      skillBadge.innerText = skillParam;
      if (skillParam === 'READING') {
        skillBadge.className = 'bg-emerald-600 text-white text-xs font-bold px-2 py-0.5 rounded font-mono uppercase';
      } else if (skillParam === 'LISTENING') {
        skillBadge.className = 'bg-blue-600 text-white text-xs font-bold px-2 py-0.5 rounded font-mono uppercase';
      } else if (skillParam === 'SPEAKING') {
        skillBadge.className = 'bg-purple-600 text-white text-xs font-bold px-2 py-0.5 rounded font-mono uppercase';
      } else {
        skillBadge.className = 'bg-iot-orange text-white text-xs font-bold px-2 py-0.5 rounded font-mono uppercase';
      }
    }
    const examTitleEl = document.getElementById('activeExamTitle');
    if (examTitleEl) examTitleEl.innerText = titleParam;

    let examCountdownRemaining = 0;
    let examCountdownInterval = null;

    function initExamRoomCountdownTimer(skill) {
      if (examCountdownInterval) clearInterval(examCountdownInterval);

      if (skill === 'LISTENING') {
        // Default 30 minutes for IELTS Listening
        examCountdownRemaining = 30 * 60;
      } else if (skill === 'READING') {
        examCountdownRemaining = 60 * 60;
      } else if (skill === 'WRITING') {
        examCountdownRemaining = 60 * 60;
      } else if (skill === 'SPEAKING') {
        examCountdownRemaining = 14 * 60;
      } else {
        examCountdownRemaining = 40 * 60;
      }

      updateRoomTimerDisplay();

      examCountdownInterval = setInterval(() => {
        // If listening audio is active, audio.ontimeupdate handles the exact sync
        const audio = document.getElementById('realListeningAudio');
        if (skill === 'LISTENING' && audio && !audio.paused && audio.duration) {
          return; // synced in ontimeupdate
        }

        if (examCountdownRemaining > 0) {
          examCountdownRemaining--;
          updateRoomTimerDisplay();

          if (examCountdownRemaining === 0) {
            clearInterval(examCountdownInterval);
            if (typeof submitExam === 'function') submitExam();
          }
        }
      }, 1000);
    }

    function updateRoomTimerDisplay() {
      const timerEl = document.getElementById('roomTimer');
      if (!timerEl) return;
      const mins = Math.floor(examCountdownRemaining / 60);
      const secs = examCountdownRemaining % 60;
      timerEl.innerText = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;

      if (examCountdownRemaining <= 300 && examCountdownRemaining > 60) {
        timerEl.className = 'font-bold text-amber-400 animate-pulse';
      } else if (examCountdownRemaining <= 60 && examCountdownRemaining > 0) {
        timerEl.className = 'font-black text-red-400 animate-ping';
      } else {
        timerEl.className = 'font-bold text-white';
      }
    }

    initExamRoomCountdownTimer(skillParam);

    // Render Test Viewport based on Skill
    const viewport = document.getElementById('testViewport');
    const chatBox = document.getElementById('aiChatBox');

    if (skillParam === 'LISTENING') {
      const rawId = urlParams.get('id') || '';
      let targetId = rawId;
      if (!targetId) {
        if (titleParam.includes('18 - Test 2') || titleParam.includes('18-t2')) targetId = 'cam18-t2';
        else if (titleParam.includes('18')) targetId = 'cam18-t1';
        else if (titleParam.includes('19 - Test 2') || titleParam.includes('19-t2')) targetId = 'cam19-t2';
        else if (titleParam.includes('19 - Test 3') || titleParam.includes('19-t3')) targetId = 'cam19-t3';
        else if (titleParam.includes('19 - Test 4') || titleParam.includes('19-t4')) targetId = 'cam19-t4';
        else if (titleParam.includes('vol4') || titleParam.includes('Syntax') || titleParam.includes('Neuro')) targetId = 'actual-vol4';
        else if (titleParam.includes('vol5') || titleParam.includes('Bias')) targetId = 'actual-vol5';
        else targetId = 'cam19-t1';
      }
      renderListeningTestEnvironment(targetId);

      const studentName = window.socraticAI && window.socraticAI.profile ? window.socraticAI.profile.name : 'Bạn';
      const studentTarget = window.socraticAI && window.socraticAI.profile ? window.socraticAI.profile.targetBand : '8.0';

      chatBox.innerHTML = `
        <div class="p-3.5 rounded-xl bg-white dark:bg-[#111C44] border border-iot-border dark:border-slate-700 shadow-sm text-xs space-y-2">
          <div class="flex items-center gap-2 text-iot-orange font-bold font-mono">
            <i data-lucide="headphones" class="w-4 h-4"></i>
            <span>Socratic Listening Mentor:</span>
          </div>
          <p class="leading-relaxed">
            Chào <strong>${studentName}</strong> (Mục tiêu Band <strong>${studentTarget}</strong>)! Bạn đang làm bài thi <strong>IELTS Listening toàn diện 4 Parts (40 câu hỏi)</strong> với <strong>băng ghi âm gốc Cambridge người bản xứ phát liên tục ~30 phút</strong>.
          </p>
          <p class="leading-relaxed text-[11px] text-iot-muted dark:text-slate-400">
            Mô phỏng 100% chuẩn thi máy tính CD-IELTS: âm thanh 30 phút chạy liên tục xuyên suốt (không bị gián đoạn hay ngắt tiếng khi bạn chuyển Tab qua lại giữa các Part), thanh timeline đầy đủ các mốc Part 1–4, bảng theo dõi 40 câu thời gian thực và tự động chấm điểm chuyển đổi IELTS Band.
          </p>
          <div class="p-2.5 rounded-lg bg-blue-50 dark:bg-blue-950/50 border border-blue-200 dark:border-blue-900 text-[11px] leading-relaxed">
            💡 <strong>Quy chế thi CD-IELTS:</strong> Âm thanh phát liền mạch từ đầu đến cuối bài thi (~30 phút). Bấm nút <strong>"Test tai nghe"</strong> bên trên để chuẩn hóa âm lượng trước khi bấm Phát.
          </div>
        </div>
      `;

      setTimeout(() => {
        if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
      }, 50);
    } else if (skillParam === 'READING') {
      // Authentic Cambridge 3-Passage Academic Reading Engine (40 Questions, 60 Minutes)
      renderReadingTestEnvironment();

      const studentName = window.socraticAI && window.socraticAI.profile ? window.socraticAI.profile.name : 'Bạn';
      const studentTarget = window.socraticAI && window.socraticAI.profile ? window.socraticAI.profile.targetBand : '8.0';

      chatBox.innerHTML = `
        <div class="p-3.5 rounded-xl bg-white dark:bg-[#111C44] border border-iot-border dark:border-slate-700 shadow-sm text-xs space-y-2.5">
          <div class="flex items-center gap-2 text-emerald-600 font-bold font-mono">
            <i data-lucide="book-open" class="w-4 h-4 text-emerald-600"></i>
            <span>SOCRATIC AI: ACADEMIC READING EXAM</span>
          </div>
          <p class="text-iot-dark dark:text-slate-200 leading-relaxed text-xs">
            Chào <strong>${studentName}</strong>! Bạn đang trong phòng thi <strong>IELTS Academic Reading</strong> chuẩn quốc tế (3 Passages, 40 câu hỏi, thời gian 60 phút).
          </p>
          <div class="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-900 text-[11px] leading-relaxed text-slate-700 dark:text-slate-300">
            💡 <strong>Quy chế thi CD-IELTS:</strong> Hãy phân bổ thời gian hợp lý (~20 phút/Passage). Nhấn <strong>Enter</strong> để chuyển câu tiếp theo, hoặc dùng bảng điều hướng 40 câu ở thanh dưới.
          </div>
          <div class="pt-1 flex items-center justify-between text-[11px] font-mono text-iot-muted border-t border-slate-100 dark:border-slate-800">
            <span>Mục tiêu: Band ${studentTarget}</span>
            <span>Chuẩn: IDP / British Council</span>
          </div>
        </div>
      `;

      setTimeout(() => {
        if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
      }, 50);
    } else if (skillParam === 'SPEAKING') {
      const targetId = urlParams.get('id') || 'cam19-spk-t1';
      renderSpeakingTestEnvironment(targetId);
    } else if (skillParam === 'FULL MOCK') {
      viewport.innerHTML = `
        <div class="space-y-6">
          <div class="p-5 bg-gradient-to-r from-blue-900 to-indigo-900 text-white rounded-2xl shadow-md space-y-3">
            <div class="flex items-center justify-between">
              <span class="bg-amber-400 text-slate-900 text-[11px] font-extrabold uppercase px-2.5 py-0.5 rounded font-mono">IELTS FULL MOCK TEST MARATHON</span>
              <span class="font-mono text-xs text-blue-200">Tổng thời gian: 2 giờ 45 phút</span>
            </div>
            <h2 class="text-xl font-bold">IELTS Academic All-in-One: Logic &amp; Syntax Marathon</h2>
            <p class="text-xs text-blue-100 leading-relaxed max-w-2xl">
              Bài thi mô phỏng toàn diện 4 kỹ năng theo đúng chuẩn Hội Đồng Anh và IDP, tích hợp hệ thống chấm điểm và phản biện luận điểm Socratic AI.
            </p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="p-4 rounded-xl border border-iot-border dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm flex items-start gap-3">
              <div class="w-10 h-10 rounded-lg bg-blue-100 text-iot-primary dark:bg-blue-950 dark:text-blue-300 flex items-center justify-center shrink-0">
                <i data-lucide="headphones" class="w-5 h-5"></i>
              </div>
              <div class="flex-1">
                <h3 class="text-sm font-bold text-iot-dark dark:text-white">Section 1: Listening</h3>
                <p class="text-[11px] text-iot-muted dark:text-slate-400">4 Sections • 40 Câu hỏi • Bẫy Logic</p>
                <button onclick="window.location.search = '?skill=LISTENING&title=' + encodeURIComponent('Full Mock - Section 1: Listening')" class="mt-2 text-xs font-bold text-iot-primary hover:underline flex items-center gap-1 font-mono">
                  Bắt đầu Nghe ➔
                </button>
              </div>
            </div>

            <div class="p-4 rounded-xl border border-iot-border dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm flex items-start gap-3">
              <div class="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-600 dark:bg-emerald-950 dark:text-emerald-300 flex items-center justify-center shrink-0">
                <i data-lucide="book-open" class="w-5 h-5"></i>
              </div>
              <div class="flex-1">
                <h3 class="text-sm font-bold text-iot-dark dark:text-white">Section 2: Reading</h3>
                <p class="text-[11px] text-iot-muted dark:text-slate-400">3 Passages • 40 Câu • Triết học Ngôn ngữ</p>
                <button onclick="window.location.search = '?skill=READING&title=' + encodeURIComponent('Full Mock - Section 2: Reading')" class="mt-2 text-xs font-bold text-emerald-600 hover:underline flex items-center gap-1 font-mono">
                  Bắt đầu Đọc ➔
                </button>
              </div>
            </div>

            <div class="p-4 rounded-xl border border-iot-border dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm flex items-start gap-3">
              <div class="w-10 h-10 rounded-lg bg-amber-100 text-iot-orange dark:bg-amber-950 dark:text-amber-300 flex items-center justify-center shrink-0">
                <i data-lucide="pen-tool" class="w-5 h-5"></i>
              </div>
              <div class="flex-1">
                <h3 class="text-sm font-bold text-iot-dark dark:text-white">Section 3: Writing</h3>
                <p class="text-[11px] text-iot-muted dark:text-slate-400">Task 1 &amp; Task 2 • Khung Biện chứng Hegel</p>
                <button onclick="window.location.search = '?skill=WRITING&title=' + encodeURIComponent('Full Mock - Section 3: Writing Task 2')" class="mt-2 text-xs font-bold text-iot-orange hover:underline flex items-center gap-1 font-mono">
                  Bắt đầu Viết ➔
                </button>
              </div>
            </div>

            <div class="p-4 rounded-xl border border-iot-border dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm flex items-start gap-3">
              <div class="w-10 h-10 rounded-lg bg-purple-100 text-purple-600 dark:bg-purple-950 dark:text-purple-300 flex items-center justify-center shrink-0">
                <i data-lucide="mic" class="w-5 h-5"></i>
              </div>
              <div class="flex-1">
                <h3 class="text-sm font-bold text-iot-dark dark:text-white">Section 4: Speaking</h3>
                <p class="text-[11px] text-iot-muted dark:text-slate-400">Part 1, 2, 3 • Socratic Voice Evaluation</p>
                <button onclick="window.location.search = '?skill=SPEAKING&title=' + encodeURIComponent('Full Mock - Section 4: Speaking Interview')" class="mt-2 text-xs font-bold text-purple-600 hover:underline flex items-center gap-1 font-mono">
                  Bắt đầu Nói ➔
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
      chatBox.innerHTML = `

    } else {

    // Room Mode Handler
    let currentRoomMode = 'exam';
    function setRoomMode(mode) {
      currentRoomMode = mode || 'exam';
      const btnPractice = document.getElementById('btnPracticeMode');
      const btnExam = document.getElementById('btnExamMode');
      const lockOverlay = document.getElementById('examLockOverlay');
      if (btnExam && btnPractice && lockOverlay) {
        if (mode === 'exam') {
          btnExam.classList.add('bg-red-600', 'text-white', 'font-bold');
          btnExam.classList.remove('text-slate-400');
          btnPractice.classList.remove('bg-iot-primary', 'text-white');
          btnPractice.classList.add('text-slate-400');
          lockOverlay.classList.remove('hidden');
        } else {
          btnPractice.classList.add('bg-iot-primary', 'text-white');
          btnPractice.classList.remove('text-slate-400');
          btnExam.classList.remove('bg-red-600', 'text-white', 'font-bold');
          btnExam.classList.add('text-slate-400');
          lockOverlay.classList.add('hidden');
        }
      }
    }
    window.setRoomMode = setRoomMode;

    function askPromptPreset(type) {
      if (currentRoomMode === 'exam') return;
      let text = '';
      if (type === 'syntax') {
        text = 'Hãy phân tích cú pháp tạo sinh câu mở đầu của tôi.';
      } else if (type === 'dialectic') {
        text = 'Gợi ý cấu trúc Phản đề Hegel cho bài này.';
      } else if (type === 'heading-logic') {
        text = 'Làm thế nào để phân biệt chính xác giữa Heading khái quát toàn đoạn và một tiểu tiết mang tính ví dụ trong Matching Headings?';
      } else if (type === 'tfng-trap') {
        text = 'Tại sao trong câu 34 về Chomsky và phẫu thuật não, đáp án bắt buộc phải là NOT GIVEN chứ không thể là FALSE theo quy luật loại trừ logic?';
      } else if (type === 'extended-mind') {
        text = 'Giải thích mối liên hệ giữa lý thuyết Extended Mind (Andy Clark) trong Đoạn F và việc dùng cấu trúc cú pháp học thuật để nâng cao năng lực tư duy.';
      } else {
        text = 'Hãy phản biện logic giúp tôi câu này.';
      }
      handleIncomingChat(text);
    }

    function handleUserChat(e) {
      e.preventDefault();
      const input = document.getElementById('userChatInput');
      const val = input.value.trim();
      if (!val) return;
      handleIncomingChat(val);
      input.value = '';
    }

    let currentMessageId = 0;

    function handleIncomingChat(userText) {
      if (currentRoomMode === 'exam') {
        if (window.socraticAI && window.socraticAI.showLearningToast) {
          window.socraticAI.showLearningToast("⚠️ Chế độ Thi thật đang bật. Trợ giảng AI tạm khóa để đảm bảo tính khảo thí độc lập.");
        }
        return;
      }

      const chatContainer = document.getElementById('aiChatBox');
      if (!chatContainer) return;

      // 1. Append User Message Bubble (Right-aligned, sleek)
      const escapedUser = window.socraticAI ? window.socraticAI.escapeHtml(userText) : userText;
      chatContainer.innerHTML += `
        <div class="flex justify-end animate-fade-in my-2">
          <div class="p-3 rounded-2xl rounded-tr-sm bg-gradient-to-r from-iot-primary to-blue-700 text-white text-xs sm:text-sm max-w-[85%] shadow-md leading-relaxed font-sans">
            ${escapedUser}
          </div>
        </div>
      `;
      chatContainer.scrollTop = chatContainer.scrollHeight;

      // 2. Append Assistant Message Skeleton with Thinking Indicator
      currentMessageId++;
      const msgId = `ai-msg-${currentMessageId}`;
      const assistantBubble = document.createElement('div');
      assistantBubble.className = 'flex items-start gap-2.5 animate-fade-in my-2';
      assistantBubble.innerHTML = `
        <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-amber-600 via-iot-orange to-amber-400 text-white flex items-center justify-center font-bold text-xs shadow-sm shrink-0 mt-1">
          ✦
        </div>
        <div class="flex-1 space-y-1.5 max-w-[92%]">
          <div class="flex items-center justify-between text-[11px] font-mono text-iot-muted dark:text-slate-400">
            <span class="font-bold text-iot-dark dark:text-slate-200">Claude / Socratic AI</span>
            <span id="${msgId}-status" class="flex items-center gap-1 text-iot-orange">
              <span class="inline-block w-1.5 h-1.5 rounded-full bg-iot-orange animate-ping"></span>
              <span>Đang tư duy logic...</span>
            </span>
          </div>
          <div id="${msgId}" class="p-3.5 rounded-2xl rounded-tl-sm bg-white dark:bg-[#0D1B3E] border border-slate-200 dark:border-slate-800 shadow-sm text-xs sm:text-sm text-iot-dark dark:text-slate-100 leading-relaxed space-y-2">
            <span class="inline-block w-2 h-4 bg-iot-primary dark:bg-blue-400 animate-pulse"></span>
          </div>
          <div id="${msgId}-actions" class="hidden flex items-center gap-3 pt-1 text-[11px] font-mono text-iot-muted dark:text-slate-400">
            <button onclick="copyMessageText('${msgId}')" class="hover:text-iot-primary flex items-center gap-1 transition-colors">
              <i data-lucide="copy" class="w-3 h-3"></i><span>Sao chép</span>
            </button>
            <button onclick="speakMessageText('${msgId}')" class="hover:text-iot-primary flex items-center gap-1 transition-colors">
              <i data-lucide="volume-2" class="w-3 h-3"></i><span>Đọc giọng mẫu</span>
            </button>
          </div>
          <div id="${msgId}-chips" class="hidden flex flex-wrap gap-1.5 pt-1.5"></div>
        </div>
      `;
      chatContainer.appendChild(assistantBubble);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      // Toggle Send/Stop buttons
      toggleStreamingControls(true);

      // 3. Trigger Real-time Token Streaming
      const contentEl = document.getElementById(msgId);
      const statusEl = document.getElementById(`${msgId}-status`);
      const actionsEl = document.getElementById(`${msgId}-actions`);
      const chipsEl = document.getElementById(`${msgId}-chips`);

      window.socraticAI.processUserMessage(
        userText,
        { skill: typeof currentExamSkill !== 'undefined' ? currentExamSkill : 'READING' },
        (accumulatedText) => {
          if (contentEl) {
            contentEl.innerHTML = window.socraticAI.renderMarkdown(accumulatedText) + '<span class="inline-block w-1.5 h-3.5 bg-iot-primary ml-0.5 animate-pulse">▋</span>';
            chatContainer.scrollTop = chatContainer.scrollHeight;
          }
        },
        (finalText) => {
          toggleStreamingControls(false);
          if (statusEl) statusEl.innerHTML = '<span class="text-emerald-500 font-mono text-[10px]">Đã hoàn tất</span>';
          if (contentEl) {
            contentEl.innerHTML = window.socraticAI.renderMarkdown(finalText);
          }
          if (actionsEl) actionsEl.classList.remove('hidden');
          if (chipsEl) {
            chipsEl.classList.remove('hidden');
            renderFollowUpChips(chipsEl, userText);
          }
          chatContainer.scrollTop = chatContainer.scrollHeight;
          lucide.createIcons();
        }
      );
    }

    function toggleStreamingControls(streaming) {
      const btnSend = document.getElementById('btnSendChat');
      const btnStop = document.getElementById('btnStopChat');
      if (btnSend && btnStop) {
        if (streaming) {
          btnSend.classList.add('hidden');
          btnStop.classList.remove('hidden');
        } else {
          btnSend.classList.remove('hidden');
          btnStop.classList.add('hidden');
        }
      }
    }

    function stopGenerating() {
      if (window.socraticAI) {
        window.socraticAI.stopStreaming();
      }
      toggleStreamingControls(false);
    }

    function clearChatMessages() {
      if (confirm("Làm mới cuộc trò chuyện với Socratic AI?")) {

    function copyMessageText(id) {

    function speakMessageText(id) {
      const el = document.getElementById(id);

      window.speechSynthesis.cancel();

      u.rate = 1.0;
      window.speechSynthesis.speak(u);

    function renderFollowUpChips(container, query) {
      const q = query.toLowerCase();
      let suggestions = [];

      if (q.includes('heading') || q.includes('đoạn')) {
        suggestions = [
          'Tại sao câu 34 là NOT GIVEN chứ không phải FALSE?',
          'Cho tôi mở bài Writing Task 2 Band 8.5',
          'Phân tích cú pháp Chomsky câu mở bài'
        ];
      } else if (q.includes('writing') || q.includes('task 2') || q.includes('chấm')) {
        suggestions = [
          'Chấm điểm bài Writing của tôi theo chuẩn cựu khảo thí IDP/BC',
          'Viết đoạn thân bài 2 theo phản đề Hegel',
          'Cách dùng câu đảo ngữ để nâng điểm GRA'
        ];
      } else if (q.includes('listening') || q.includes('nghe')) {
        suggestions = [
          'Cách tránh bẫy đổi ý phút chót trong Section 1',
          'Giải thích nguyên lý Epoché trong bài nghe',
          'Tua lại đoạn hội thoại câu 1 và 2'
        ];
      } else {
        suggestions = [
          'Tại sao câu 34 là NOT GIVEN?',
          'Hướng dẫn dàn ý Biện chứng Hegel',
          'Xem hồ sơ điểm mù nhận thức của tôi'
        ];
      }

      container.innerHTML = suggestions.map(s => `
        <button onclick="handleIncomingChat('${s.replace(/'/g, "\\'")}')" class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-blue-50 dark:bg-slate-800 dark:hover:bg-blue-950/60 text-slate-700 dark:text-slate-300 hover:text-iot-primary text-[11px] font-sans border border-slate-200 dark:border-slate-700 transition-all flex items-center gap-1 shadow-sm">

    }

    function submitExam() {
      if (window.examLockdown && typeof window.examLockdown.releaseExamLockdown === 'function') {
        window.examLockdown.releaseExamLockdown();
      }
      if (typeof skillParam !== 'undefined' && skillParam === 'LISTENING') {
        checkListeningAnswers();
        return;
      }
      if (typeof skillParam !== 'undefined' && skillParam === 'READING') {
        checkReadingAnswers();
        return;
      }
      if (typeof skillParam !== 'undefined' && skillParam === 'WRITING') {
        if (typeof submitWritingExamForGrading === 'function') {
          submitWritingExamForGrading();
        } else {
          submitExamWritingForGrading();
        }
        return;
      }
      if (typeof skillParam !== 'undefined' && skillParam === 'SPEAKING') {
        if (typeof submitSpeakingExam === 'function') {
          submitSpeakingExam();
          return;
        }
      }
      if (window.socraticAI && window.socraticAI.showLearningToast) {
        window.socraticAI.showLearningToast("✅ Bài thi đã được nộp thành công! Hệ thống đang tổng hợp báo cáo năng lực.");
      }
      setRoomMode('practice');
    }
    window.submitExam = submitExam;

    function submitExamWritingForGrading() {
      if (typeof window.submitWritingExamForGrading === 'function') {
        window.submitWritingExamForGrading();
        return;
      }
      if (window.examLockdown && typeof window.examLockdown.releaseExamLockdown === 'function') {
        window.examLockdown.releaseExamLockdown();
      }
      const input = document.getElementById('examWritingInput');
      if (!input) return;
      const essay = input.value.trim();
      if (!essay) {
        if (window.socraticAI && window.socraticAI.showLearningToast) {
          window.socraticAI.showLearningToast("⚠️ Vui lòng viết bài luận trước khi yêu cầu chấm điểm.");
        }
        return;
      }
      setRoomMode('practice');
      const promptEl = document.querySelector('.text-sm.font-semibold.text-iot-dark') || document.querySelector('.font-mono.text-iot-primary');
      const promptText = promptEl ? promptEl.innerText.replace(/"/g, '') : 'IELTS Writing Task 2';

      const chatMsg = `Chấm điểm bài viết IELTS Writing sau đây theo tiêu chuẩn nghiêm ngặt của cựu giám khảo IDP/BC:\n\n[Đề bài]: ${promptText}\n\n[Bài làm]:\n${essay}`;
      handleIncomingChat(chatMsg);
    }

    // ==========================================
    // AUTHENTIC CAMBRIDGE 3-PASSAGE READING ENGINE (40 QUESTIONS, 60 MINUTES)
    // Implemented in reading-engine.js (Passages 1–3, Full Palette, IDP/BC Scorecard)
    // ==========================================
    // ==========================================
    // EXAM ROOM WRITING PROOFREADING & COUNTER
    // ==========================================
    // EXAM ROOM WRITING PROOFREADING & COUNTER
    // ==========================================
    let lastExamWritingAnalysis = null;
    let currentExamScoreMode = 'original'; // 'original' | 'upgraded'
    let selectedExamIssueNumber = null;

    function updateExamWritingCount() {
      const input = document.getElementById('examWritingInput');
      const counter = document.getElementById('writingWordCounter');
      if (!input || !counter) return;
      const text = input.value.trim();
      const words = text ? text.split(/\s+/).filter(w => w.length > 0).length : 0;
      counter.innerText = `Số từ: ${words} từ (Yêu cầu: 250+)`;
    }

    function setExamScoreMode(mode) {
      currentExamScoreMode = mode;
      const btnOrig = document.getElementById('btnExamScoreOriginal');
      const btnUpg = document.getElementById('btnExamScoreUpgraded');
      if (btnOrig && btnUpg) {
        if (mode === 'original') {
          btnOrig.className = 'px-2.5 py-1 rounded-md font-bold transition-all bg-white dark:bg-slate-700 text-iot-dark dark:text-white shadow-xs';
          btnUpg.className = 'px-2.5 py-1 rounded-md font-bold transition-all text-iot-muted hover:text-iot-primary';
        } else {
          btnUpg.className = 'px-2.5 py-1 rounded-md font-bold transition-all bg-iot-orange text-white shadow-xs';
          btnOrig.className = 'px-2.5 py-1 rounded-md font-bold transition-all text-iot-muted hover:text-iot-primary';
        }
      }
      renderExamCircularGauges();
    }

    function renderExamCircularGauges() {
      const container = document.getElementById('examCircularGaugesContainer');
      if (!container || !lastExamWritingAnalysis) return;
      const scores = lastExamWritingAnalysis.criteriaScores ? lastExamWritingAnalysis.criteriaScores[currentExamScoreMode] : {
        overall: 6.0,
        lexicalResource: 5.5,
        grammarAccuracy: 6.0,
        coherenceCohesion: 6.5,
        taskResponse: 6.0
      };

      const metrics = [
        { key: 'overall', label: 'OVERALL BAND', score: scores.overall, isMajor: true, color: currentExamScoreMode === 'upgraded' ? '#00b4d8' : '#2563eb' },
        { key: 'lexicalResource', label: 'Lexical Resource', score: (scores.lexicalResource || scores.lr || 5.5), isMajor: false, color: '#f59e0b' },
        { key: 'grammarAccuracy', label: 'Grammar & Accuracy', score: (scores.grammarAccuracy || scores.gra || 5.5), isMajor: false, color: '#10b981' },
        { key: 'coherenceCohesion', label: 'Coherence & Cohesion', score: (scores.coherenceCohesion || scores.cc || 6.0), isMajor: false, color: '#8b5cf6' },
        { key: 'taskResponse', label: 'Task Response', score: (scores.taskResponse || scores.tr || 6.0), isMajor: false, color: '#ec4899' }
      ];

      container.innerHTML = metrics.map(m => {
        const radius = m.isMajor ? 32 : 28;
        const strokeWidth = m.isMajor ? 6 : 5;
        const circumference = 2 * Math.PI * radius;
        // Formula: 9.0 is a 100% complete circle (offset = 0)
        const progressFraction = Math.min(1, Math.max(0, m.score / 9.0));
        const strokeDashoffset = circumference * (1 - progressFraction);
        const center = m.isMajor ? 38 : 34;
        const size = center * 2;

        return `
          <div class="flex flex-col items-center justify-center p-2 rounded-lg ${m.isMajor ? 'bg-blue-50/60 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-900/60' : ''} text-center">
            <div class="relative flex items-center justify-center" style="width: ${size}px; height: ${size}px;">
              <svg width="${size}" height="${size}" class="transform -rotate-90">
                <circle cx="${center}" cy="${center}" r="${radius}" stroke="currentColor" stroke-width="${strokeWidth}" class="text-slate-200 dark:text-slate-700/60" fill="transparent" />
                <circle cx="${center}" cy="${center}" r="${radius}" stroke="${m.color}" stroke-width="${strokeWidth}" stroke-dasharray="${circumference}" stroke-dashoffset="${strokeDashoffset}" stroke-linecap="round" fill="transparent" style="transition: stroke-dashoffset 0.8s ease-in-out;" />
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                <span class="${m.isMajor ? 'text-sm font-black' : 'text-xs font-bold'} font-mono text-iot-dark dark:text-white leading-none">${m.score.toFixed(1)}</span>
                <span class="text-[9px] font-mono text-iot-muted leading-tight">/ 9.0</span>
              </div>
            </div>
            <span class="mt-1.5 text-[10px] ${m.isMajor ? 'font-bold text-iot-primary dark:text-blue-300' : 'text-slate-600 dark:text-slate-400'} uppercase font-mono tracking-tight">${m.label}</span>
          </div>
        `;
      }).join('');
    }
    window.renderExamCircularGauges = renderExamCircularGauges;
    window.setExamScoreMode = setExamScoreMode;

    function selectExamIssue(issueNumber) {
      selectedExamIssueNumber = issueNumber;
      if (!lastExamWritingAnalysis || !lastExamWritingAnalysis.allIssues) return;
      const issue = lastExamWritingAnalysis.allIssues.find(i => i.issueNumber === issueNumber);
      const card = document.getElementById('examActiveIssueCard');
      if (!card || !issue) return;

      document.querySelectorAll('.exam-in-situ-tag').forEach(el => {
        el.classList.remove('ring-4', 'ring-iot-orange', 'scale-105');
      });
      const targetTag = document.getElementById(`exam-tag-issue-${issueNumber}`);
      if (targetTag) {
        targetTag.classList.add('ring-4', 'ring-iot-orange', 'scale-105');
        targetTag.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      const isSpelling = issue.type === 'spelling';
      card.classList.remove('hidden');
      card.innerHTML = `
        <div class="flex items-start justify-between gap-2 border-b border-amber-200 dark:border-amber-900/50 pb-2">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-iot-orange text-white font-mono font-bold text-xs flex items-center justify-center shrink-0">#${issue.issueNumber}</span>
            <div>
              <div class="flex items-center gap-2">
                <span class="font-bold text-xs font-mono ${isSpelling ? 'text-red-600 line-through' : 'text-slate-700 dark:text-slate-200'}">"${issue.originalText}"</span>
                <span class="text-iot-muted font-mono text-xs">➔</span>
                <span class="font-black text-xs font-mono text-iot-primary dark:text-blue-400 bg-white dark:bg-slate-800 px-2 py-0.5 rounded border border-blue-200 dark:border-blue-900">${issue.replacement}</span>
              </div>
              <span class="text-[10px] text-iot-muted font-mono">${issue.criterion || (isSpelling ? 'Grammatical Accuracy' : 'Lexical Resource')} • ${issue.cefrOriginal || 'A2/B1'} ➔ ${issue.cefrUpgraded || 'C1/C2'}</span>
            </div>
          </div>
          <button onclick="replaceExamSingleIssue(${issue.issueNumber})" class="px-3 py-1 rounded-lg bg-iot-orange hover:bg-iot-orangeHover text-white font-bold text-xs shadow-xs transition-all flex items-center gap-1 active:scale-95 shrink-0">
            <i data-lucide="check" class="w-3.5 h-3.5"></i>
            <span>Thay thế từ này</span>
          </button>
        </div>

        <div class="space-y-1.5 text-xs text-slate-700 dark:text-slate-300">
          <div class="p-2 rounded bg-amber-100/60 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900/40">
            <span class="font-bold text-amber-900 dark:text-amber-200">⚠️ Tại sao bài gốc bị trừ điểm:</span>
            <p class="text-[11px] mt-0.5 leading-relaxed">${issue.whyWeak}</p>
          </div>
          <div class="p-2 rounded bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-900/40">
            <span class="font-bold text-iot-primary dark:text-blue-300">💡 Vì sao nên đặt là "${issue.replacement}" (Bản chất ngôn ngữ học):</span>
            <p class="text-[11px] mt-0.5 leading-relaxed">${issue.whyReplacement}</p>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function replaceExamSingleIssue(issueNumber) {
      if (!lastExamWritingAnalysis || !lastExamWritingAnalysis.allIssues) return;
      const issue = lastExamWritingAnalysis.allIssues.find(i => i.issueNumber === issueNumber);
      const input = document.getElementById('examWritingInput');
      if (!issue || !input) return;

      const regex = new RegExp(`\\b${escapeRegExpExam(issue.originalText)}\\b`, 'i');
      input.value = input.value.replace(regex, issue.replacement);
      updateExamWritingCount();
      runExamWritingProofread();
    }

    function escapeRegExpExam(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function runExamWritingProofread() {
      const input = document.getElementById('examWritingInput');
      if (!input) return;
      const text = input.value.trim();
      if (!text) {
        alert('Vui lòng viết bài luận trước khi bấm kiểm tra.');
        return;
      }

      if (window.socraticAI && window.socraticAI.analyzeAndBoostText) {
        const res = window.socraticAI.analyzeAndBoostText(text);
        lastExamWritingAnalysis = res;

        const box = document.getElementById('examWritingProofreadBox');
        const countBadge = document.getElementById('examIssuesCountBadge');
        const annotatedEl = document.getElementById('examProofAnnotated');
        const detailsEl = document.getElementById('examProofDetails');
        const applyBtn = document.getElementById('btnExamApplyPolished');

        if (box) box.classList.remove('hidden');
        if (applyBtn) applyBtn.classList.remove('hidden');

        // Render circular gauges (9.0 = full circle)
        renderExamCircularGauges();

        const issues = res.allIssues || [];
        if (countBadge) {
          countBadge.innerText = `${issues.length} vị trí cần cải thiện`;
        }

        // Render In-Situ Numbered Annotations
        if (annotatedEl) {
          if (issues.length === 0) {
            annotatedEl.innerHTML = `<span class="text-iot-green font-bold">✓ Tuyệt vời! Văn bản không phát hiện lỗi chính tả hay từ vựng bậc thấp.</span><br/>${text}`;
          } else {
            let runningText = text;
            const sortedIssues = [...issues].sort((a, b) => b.originalText.length - a.originalText.length);
            sortedIssues.forEach(iss => {
              const regex = new RegExp(`\\b${escapeRegExpExam(iss.originalText)}\\b`, 'gi');
              const isSpelling = iss.type === 'spelling';
              runningText = runningText.replace(regex, (match) => `
                <span id="exam-tag-issue-${iss.issueNumber}" onclick="selectExamIssue(${iss.issueNumber})" class="exam-in-situ-tag inline-flex items-center gap-1 mx-0.5 px-2 py-0.5 rounded cursor-pointer transition-all border font-sans select-none ${isSpelling ? 'bg-red-50 hover:bg-red-100 text-red-700 border-red-300 dark:bg-red-950/60 dark:text-red-300 dark:border-red-800' : 'bg-blue-50 hover:bg-blue-100 text-iot-primary border-blue-300 dark:bg-blue-950/60 dark:text-blue-300 dark:border-blue-800'}">
                  <span class="w-4 h-4 rounded-full text-[10px] font-mono font-bold flex items-center justify-center ${isSpelling ? 'bg-red-600 text-white' : 'bg-iot-orange text-white'}">#${iss.issueNumber}</span>
                  <span class="font-bold underline decoration-dotted">${match}</span>
                  <span class="text-[10px] font-mono opacity-80">➔ ${iss.replacement}</span>
                </span>
              `);
            });
            annotatedEl.innerHTML = runningText;
          }
        }

        // Auto-select first issue
        if (issues.length > 0) {
          selectExamIssue(issues[0].issueNumber);
        } else {
          const card = document.getElementById('examActiveIssueCard');
          if (card) card.classList.add('hidden');
        }

        // Render Details Grid
        if (detailsEl) {
          if (issues.length === 0) {
            detailsEl.innerHTML = `<p class="col-span-2 text-xs text-iot-green">Không có điểm yếu từ vựng hoặc chính tả cần khắc phục.</p>`;
          } else {
            detailsEl.innerHTML = issues.map(iss => {
              const isSpelling = iss.type === 'spelling';
              return `
                <div onclick="selectExamIssue(${iss.issueNumber})" class="p-2.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-iot-orange cursor-pointer transition-all flex items-start justify-between gap-2 shadow-xs">
                  <div class="space-y-1">
                    <div class="flex items-center gap-1.5 font-mono text-xs">
                      <span class="w-4 h-4 rounded-full ${isSpelling ? 'bg-red-600' : 'bg-iot-orange'} text-white text-[10px] font-bold flex items-center justify-center">#${iss.issueNumber}</span>
                      <span class="${isSpelling ? 'line-through text-red-600' : 'font-semibold text-slate-700 dark:text-slate-300'}">"${iss.originalText}"</span>
                      <span class="text-iot-muted">➔</span>
                      <strong class="text-iot-primary dark:text-blue-400 font-bold">${iss.replacement}</strong>
                    </div>
                    <p class="text-[10px] text-iot-muted dark:text-slate-400 line-clamp-1">${iss.whyWeak}</p>
                  </div>
                  <button onclick="event.stopPropagation(); replaceExamSingleIssue(${iss.issueNumber})" class="px-2 py-1 rounded bg-iot-orange hover:bg-iot-orangeHover text-white text-[10px] font-bold transition-all shrink-0">
                    Áp dụng
                  </button>
                </div>
              `;
            }).join('');
          }
        }

        lucide.createIcons();
      }
    }

    function applyExamWritingPolished() {
      if (!lastExamWritingAnalysis || !lastExamWritingAnalysis.polishedText) return;
      const input = document.getElementById('examWritingInput');
      if (input) {
        input.value = lastExamWritingAnalysis.polishedText;
        updateExamWritingCount();
        runExamWritingProofread();
        alert('✓ Đã áp dụng toàn bộ bản nâng cấp từ vựng và sửa lỗi chính tả vào bài viết!');
      }
    }

    function syncStudentUI() {
      if (window.socraticAI && window.socraticAI.profile) {
        const p = window.socraticAI.profile;
        const nameEl = document.getElementById('aiSidebarStudentName');
        const targetEl = document.getElementById('aiSidebarTargetBand');
        const navBadge = document.getElementById('navBarStudentBadge');
        if (nameEl) nameEl.innerText = p.name;
        if (targetEl) targetEl.innerText = p.targetBand;
        if (navBadge) navBadge.innerText = `${p.name} (${p.targetBand})`;
      }
    }

    window.addEventListener('DOMContentLoaded', syncStudentUI);
    setTimeout(syncStudentUI, 100);

    lucide.createIcons();
  </script>

</body>

</html>
